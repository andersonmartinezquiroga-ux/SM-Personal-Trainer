name: SJM Control 360 - Cola autonomica con evidencia
# Cola PUBLICA de solo lectura: sin candidaturas ni datos personales.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sjm-control360/queue_worker.py'
      - 'sjm-control360/public_jobs.json'
      - '.github/workflows/sjm_control360_queue.yml'
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: write

concurrency:
  group: sjm-control360-public-queue
  cancel-in-progress: false

jobs:
  process-public-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout SJM control code and existing evidence
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Validate safety and data controls
        run: python3 sjm-control360/queue_worker.py --self-test

      - name: Process due public jobs and write JSON evidence
        run: python3 sjm-control360/queue_worker.py

      - name: Preserve JSON and Spanish report as evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sjm-control360-queue-evidence
          path: |
            sjm-control360/public_results.json
            sjm-control360/ESTADO.md
          retention-days: 30
          if-no-files-found: warn

      - name: Publish results to GitHub
        run: |
          git config user.name 'SJM CONTROL 360 Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sjm-control360/public_results.json sjm-control360/ESTADO.md
          if ! git diff --cached --quiet; then
            git commit -m 'SJM Control 360: record autonomous public queue evidence'
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                echo "Evidence persisted successfully"
                exit 0
              fi
              echo "Concurrent repository update; rebasing before retry"
              git pull --rebase origin main
            done
            echo "Failed to persist evidence after three attempts"
            exit 1
          fi
