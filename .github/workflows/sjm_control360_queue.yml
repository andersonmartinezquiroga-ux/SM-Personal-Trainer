name: SJM Control 360 - Cola autonomica con evidencia
# Cola publica de inspecciones autorizadas: NO postular, NO datos personales.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sjm-control360/queue_worker.py'
      - 'sjm-control360/public_jobs.json'
      - '.github/workflows/sjm_control360_queue.yml'
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: write

concurrency:
  group: sjm-control360-public-queue
  cancel-in-progress: false

jobs:
  process-public-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout SJM control code and existing evidence
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Validate safety and data controls
        run: python3 sjm-control360/queue_worker.py --self-test

      - name: Process due public jobs and write JSON evidence
        run: python3 sjm-control360/queue_worker.py

      - name: Save independently inspectable result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sjm-control360-queue-evidence
          path: |\n            sjm-control360/public_results.json\n            sjm-control360/ESTADO.md
          retention-days: 30
          if-no-files-found: warn

      - name: Persist queue progress to GitHub (no sensitive data)
        run: |
          git config user.name 'SJM CONTROL 360 Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sjm-control360/public_results.json sjm-control360/ESTADO.md
          if ! git diff --cached --quiet; then
            git commit -m 'SJM Control 360: record autonomous read-only queue results'
            git push origin HEAD:main
          fi
