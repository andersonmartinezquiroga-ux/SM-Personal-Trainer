name: SJM Executor - safe preflight regression (no submissions)
on:
  workflow_dispatch:
  push:
    branches: [sjm-executor-render]
    paths:
      - 'sjm-executor/applicant.py'
      - 'sjm-executor/form_adapter.py'
      - 'sjm-executor/test_applicant.py'
      - 'sjm-executor/test_form_adapter.py'
      - '.github/workflows/sjm-executor-preflight-safety.yml'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local unit test prerequisites
        run: python -m pip install -r sjm-executor/requirements.txt
      - name: Run all security and form adapter tests (OFFLINE)
        working-directory: sjm-executor
        run: |
          python -m unittest -v test_applicant test_form_adapter test_submit_ypai
      - name: Record non-submission evidence
        if: success()
        run: |
          echo "## SJM executor safety" >> "$GITHUB_STEP_SUMMARY"
          echo "- ✅ Required CV widgets and security gates validated offline" >> "$GITHUB_STEP_SUMMARY"
          echo "- 🔒 No real applications or personal data transmitted" >> "$GITHUB_STEP_SUMMARY"
