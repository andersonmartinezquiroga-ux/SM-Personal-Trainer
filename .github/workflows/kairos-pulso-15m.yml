name: KAIRÓS 360 — Pulso de coordinación
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kairos-pulso-15m
  cancel-in-progress: false
jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validar configuración y disparar coordinador
        env:
          KAIROS_PULSE_URL: ${{ secrets.KAIROS_PULSE_URL }}
          KAIROS_PULSE_TOKEN: ${{ secrets.KAIROS_PULSE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${KAIROS_PULSE_URL:-}" || -z "${KAIROS_PULSE_TOKEN:-}" ]]; then
            echo "::notice::Pulso en modo seguro: faltan URL/token. No se ejecutó ninguna acción."
            exit 0
          fi
          if [[ "$KAIROS_PULSE_URL" != https://* ]]; then
            echo "::error::KAIROS_PULSE_URL debe usar HTTPS"
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 75 --retry 2 --retry-delay 5 \
            -X POST "$KAIROS_PULSE_URL" \
            -H "Authorization: Bearer $KAIROS_PULSE_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"source":"github-actions","operation":"coordinate","mode":"verify-and-queue","regions":[1,2,3,4,5,6],"allow_unverified_submission":false}'
          echo "Coordinador respondió correctamente; revisar auditoría para verificar acciones."
