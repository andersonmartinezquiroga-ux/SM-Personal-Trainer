name: SJM Browser Executor — E2E test
# Ashby public GraphQL read classifier investigation — exact approved public variables
# Ashby public CDN assets, human-challenge classification and exact URL gates
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/sjm_executor_test.yml
permissions:
  contents: read
jobs:
  form-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout active executor development branch
        uses: actions/checkout@v4
        with:
          ref: sjm-executor-render
      - name: Python and Playwright
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r sjm-executor/requirements.txt
      - run: python -m playwright install chromium --with-deps
      - name: Verify domain and SSRF restrictions
        working-directory: sjm-executor
        run: python -m unittest -v test_applicant test_submit_ypai
      - name: Browser test, local form submission, then public form inspection
        working-directory: sjm-executor
        env:
          EXECUTOR_TOKEN: gha-local-test-only
        run: |
          python - <<'PY'
          import json, os, subprocess, time, urllib.request, urllib.error
          env=dict(os.environ); env['SUBMISSION_TOKEN']='gha-dedup-confirmed-only'; proc=subprocess.Popen(['python','api_v2.py'],env=env,stdout=subprocess.DEVNULL,stderr=subprocess.STDOUT)
          def req(path,body=None,authorized=True,token='gha-local-test-only'):
              data=None if body is None else json.dumps(body).encode()
              headers={'Content-Type':'application/json'}
              if authorized: headers['Authorization']='Bearer '+token
              with urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:10000'+path,data=data,headers=headers),timeout=60) as r:
                  return r.status,json.load(r)
          try:
              for attempt in range(30):
                  try: req('/healthz');break
                  except Exception:time.sleep(1)
              else:raise RuntimeError('server failed to start')
              try:
                  req('/self-test',{},authorized=False)
                  raise AssertionError('unauthorized unexpectedly worked')
              except urllib.error.HTTPError as e:
                  assert e.code==401,e.code
              try:
                  req('/jobs/submit-ypai',{'case_key':'sjm-ypai-data-annotator-20261017-v1','name':'Test Person','email':'test@example.invalid','country':'Colombia','consent_approved':True,'agreement_approved':True})
                  raise AssertionError('inspector credential unexpectedly authorized employer submission')
              except urllib.error.HTTPError as e:
                  assert e.code==401,e.code
              print('PASS: employer submission inaccessible using inspector token')
              try:
                  req('/jobs/submit-ypai',{'case_key':'sjm-ypai-data-annotator-20261017-v1','name':'Test Person','email':'test@example.invalid','country':'Colombia','consent_approved':True,'agreement_approved':True},token='gha-dedup-confirmed-only')
                  raise AssertionError('a duplicate job application endpoint was unexpectedly open')
              except urllib.error.HTTPError as e:
                  assert e.code==410,e.code
                  body=json.load(e)
                  assert body.get('duplicate_prevented') is True,body
              print('PASS: even authorized repeat submission is permanently blocked after prior Work submission')
              code,res=req('/self-test',{})
              assert code==200 and res['form']['submitted'] is True and res['form']['confirmation']=='RECIBIDO',res
              print('PASS: authenticated browser navigation + local form completed and confirmation RECIBIDO')
              print('PASS: unauthenticated form submission blocked')
              url='https://jobs.lever.co/weloglobal/54157634-2cb4-4073-a1e6-4b51f3d411fd/apply'
              try:
                  code,body=req('/jobs/inspect',{'url':url})
                  assert code==200 and body['submitted'] is False,body
                  print('PASS: official external form read-only inspection',json.dumps({'title':body['title'],'fields':body['form_fields_total'],'forms':body['form_count'],'submitted':body['submitted']}))
                  print('REQUIRED_JOB_FIELDS_METADATA',json.dumps([{'name':x['name'],'type':x['type'],'label':x['label']} for x in body['fields'] if x['required']][:25],ensure_ascii=False))
              except Exception as e:
                  print('EXTERNAL_INSPECT_NOT_YET_VERIFIED:',type(e).__name__,str(e)[:180])
                  raise
              circinus='https://jobs.lever.co/weloglobal/9bf1acc5-82ec-446b-9cb0-429f08b9d8f1'
              code,welo=req('/jobs/inspect',{'url':circinus})
              assert code==200 and welo['submitted'] is False,welo
              assert welo.get('followed_application_page') and welo['final_url'].endswith('/apply'),welo
              assert welo.get('required_phone') is True,welo
              print('PASS: Welo Circinus /apply discovered; required phone flagged; NO applicant data or submission',
                    json.dumps({'fields':welo['form_fields_total'],'required_phone':welo['required_phone'],'submitted':welo['submitted']}))
              ashby='https://jobs.ashbyhq.com/anyone-ai/f90e4b5c-1682-4ddf-bb00-c8a11738a393'
              code,ashby_meta=req('/jobs/inspect',{'url':ashby})
              assert code==200 and ashby_meta['submitted'] is False,ashby_meta
              assert ashby_meta.get('followed_application_page') and ashby_meta['final_url'].endswith('/application'),ashby_meta
              assert not ashby_meta['submitted'],ashby_meta
              assert ashby_meta.get('public_form_rendered'),ashby_meta
              assert ashby_meta.get('required_phone') is True,ashby_meta
              assert ashby_meta.get('required_cv') is True,ashby_meta
              assert ashby_meta.get('required_file_upload') is True,ashby_meta
              assert ashby_meta.get('application_form_visible') is True,ashby_meta
              print('PASS: Ashby mandatory phone and resume flagged; NO applicant data submitted')
              if ashby_meta['form_fields_total']>0:
                  print('PASS: Ashby application fields inspected READ ONLY',json.dumps({'fields':ashby_meta['form_fields_total'],'url':ashby_meta['final_url'],'submitted':False}))
              else:
                  print('ASHBY_BLOCKED_DEPENDENCIES',json.dumps(ashby_meta.get('blocked_resource_metadata',[]),ensure_ascii=False))
                  raise AssertionError('Ashby adapter still cannot inspect live form fields — not fixed')
              # Verify new exact-URL public listing connectors; never fill or submit
              listing_urls=[
                'https://www.workana.com/es/job/asistente-virtual-y-soporte-al-cliente-remoto-en-espanol',
                'https://community.transperfect.com/jobs/720525-audio-quality-assurance-reviewer-spanish-colombia',
                'https://jobs.lever.co/weloglobal/9bf1acc5-82ec-446b-9cb0-429f08b9d8f1'
              ]
              for listing_url in listing_urls:
                  code,listing=req('/jobs/inspect',{'url':listing_url})
                  assert code==200 and listing['submitted'] is False,listing
                  assert listing.get('title'),listing
                  if listing_url.startswith('https://jobs.lever.co/'):
                      assert listing.get('followed_application_page') and listing.get('form_fields_total',0)>=2,listing
                      assert listing['final_url'].endswith('/apply'),listing
                      print('PASS: Welo listing followed GET /apply and form metadata read without candidate data',listing['form_fields_total'])
                  if listing.get('challenge_detected'):
                      assert not listing.get('listing_visible'),listing
                      print('PASS: HUMAN CHALLENGE correctly blocked, never treated as a job',json.dumps({'url':listing_url,'title':listing['title']}))
                  else:
                      assert listing.get('listing_visible'),listing
                      print('PASS: PUBLIC LISTING GET only',json.dumps({'url':listing_url,'title':listing['title'],'fields':listing['form_fields_total'],'submitted':listing['submitted']}))
              yurl='https://freelancer.ypai.ai/jobs/openings/data-annotator-co'
              code,ybody=req('/jobs/inspect',{'url':yurl})
              assert code==200 and ybody['submitted'] is False,ybody
              assert ybody['form_fields_total']>=2,ybody
              print('PASS YPAI Data Annotator form inspected without submission',json.dumps({'title':ybody['title'],'fields':ybody['form_fields_total'],'consent_present':ybody['consent_or_captcha_present'],'submitted':False}))
              print('YPAI_PUBLIC_FIELDS',json.dumps([{'name':x['name'],'type':x['type'],'label':x['label']} for x in ybody['fields']],ensure_ascii=False))
              # Former Workana 400 cases: check only two exact public listing URLs.
              for listing_url in (
                  'https://www.workana.com/es/job/asistente-virtual-y-soporte-al-cliente-remoto-en-espanol',
                  'https://www.workana.com/es/job/asistente-virtual-full-time-para-configuracion-de-apps-y-gestion-de-clientes'):
                  code, listing=req('/jobs/inspect',{'url':listing_url})
                  assert code==200 and listing['submitted'] is False,listing
                  assert listing.get('listing_visible') or listing.get('challenge_detected'),listing
                  if listing.get('challenge_detected'):
                      print('PASS Workana human challenge detected and NOT bypassed',json.dumps({'url':listing_url,'submitted':False}))
                  else:
                      print('PASS Workana listing read-only',json.dumps({'url':listing_url,'title':listing['title'],'fields':listing['form_fields_total'],'submitted':False}))
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
                  f.write('## SJM Browser Executor\\n\\n- ✅ Local form completed: RECIBIDO\\n- ✅ Authentication gate tested\\n- ✅ Official external job form inspected without submission\\n- 🔒 **0 external applications submitted**\\n')
          finally:proc.terminate()
          PY
