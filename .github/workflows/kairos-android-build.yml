name: KAIRÓS Móvil · APK de prueba
on:
  push:
    branches: [feature/kairos-mobile-v1]
    paths: ['kairos-mobile/**', '.github/workflows/kairos-android-build.yml']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: kairos-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: KairosMobile-debug-APK
          path: kairos-mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
