name: KAIRÓS Móvil · APK de prueba
on:
  push:
    branches: [feature/kairos-mobile-v02]
    paths: ['kairos-mobile/**', '.github/workflows/kairos-android-build.yml']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: kairos-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar SDK Android del runner
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Pruebas de navegación segura
        run: |
          mkdir -p build/policy-test
          javac -d build/policy-test app/src/main/java/com/sjm/kairos/mobile/SjmNavigationPolicy.java app/src/test/java/com/sjm/kairos/mobile/NavigationPolicySelfTest.java
          java -cp build/policy-test com.sjm.kairos.mobile.NavigationPolicySelfTest
      - name: Compilar APK debug
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: KairosMobile-debug-APK
          path: kairos-mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
