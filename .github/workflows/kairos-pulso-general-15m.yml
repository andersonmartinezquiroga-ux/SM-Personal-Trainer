name: KAIRÓS 360 — Pulso general cada 15 minutos
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kairos-pulso-general-15m.yml'
      - 'sjm-public-radar/**'
permissions:
  contents: read
  id-token: write
concurrency:
  group: kairos-pulso-general
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Autenticar GitHub Actions y enviar pulso al coordinador
        shell: bash
        run: |
          set -euo pipefail
          token_json=$(curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sjm-kairos-pulse-v1")
          token=$(echo "$token_json" | python3 -c 'import json,sys;print(json.load(sys.stdin)["value"])')
          curl --fail-with-body --silent --show-error --max-time 100 --retry 2 --retry-delay 10 \
            --request POST 'https://sjm-kairos-lab-alterno.onrender.com/coordinate' \
            --header "Authorization: Bearer $token" \
            --header "Content-Type: application/json" \
            --data '{"operation":"coordinate","interval_minutes":15}'

  public-discovery:
    name: Buscar vacantes solo después de coordinar cierres
    needs: dispatch
    if: ${{ needs.dispatch.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Obtener el código vigente del radar
        uses: actions/checkout@v4
      - name: Buscar vacantes en fuentes oficiales (solo lectura)
        run: python3 sjm-public-radar/scan.py
      - name: Conservar evidencia de cada pulso
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kairos-radar-publico-15m
          path: sjm-radar-public-results.json
          retention-days: 7
          if-no-files-found: warn
