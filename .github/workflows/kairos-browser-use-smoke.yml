name: KAIRÓS Browser Use isolated smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installation-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Browser Use in disposable runner
        run: python -m pip install --disable-pip-version-check 'browser-use==0.13.14'
      - name: Verify import and installed version without credentials
        run: |
          python - <<'PY'
          import importlib.metadata
          import browser_use
          version = importlib.metadata.version('browser-use')
          print('BROWSER_USE_INSTALL_OK', version)
          PY
      - name: Security note
        run: echo 'No credentials, no live browser, no application submissions, no production deployment.'
