plugins { id 'com.android.application' }
android {
    namespace 'com.sjm.kairos.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'com.sjm.kairos.mobile'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '0.3.4'
    }
    signingConfigs {
        release {
            def filePath = System.getenv('KAIROS_SIGNING_FILE')
            if (filePath != null && !filePath.isEmpty()) {
                storeFile file(filePath)
                storePassword System.getenv('KAIROS_SIGNING_STORE_PASS')
                keyAlias System.getenv('KAIROS_SIGNING_ALIAS')
                keyPassword System.getenv('KAIROS_SIGNING_STORE_PASS')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
