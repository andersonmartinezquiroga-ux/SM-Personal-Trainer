plugins { id 'com.android.application' }
android {
    namespace 'com.sjm.mobileapps'
    compileSdk 35
    defaultConfig {
        applicationId 'com.sjm.mobileapps'
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName '1.0.0'
    }
    flavorDimensions 'application'
    productFlavors {
        biblia {
            dimension 'application'
            applicationId 'com.sjm.mibibliaviva'
            resValue 'string', 'app_name', 'Mi Biblia Viva'
        }
        ingles {
            dimension 'application'
            applicationId 'com.sjm.englishacademy'
            resValue 'string', 'app_name', 'SJM English Academy'
        }
        traductor {
            dimension 'application'
            applicationId 'com.sjm.universaltranslator'
            resValue 'string', 'app_name', 'SJM Universal Translator'
        }
    }
    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
